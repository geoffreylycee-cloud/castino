services:
  - type: web
    name: castino-multiplayer
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:cloud
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ENABLE_BOT_FEED
        value: "false"
      - key: ADMIN_USERNAME
        value: geoadmin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
